<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豆屿 · 拼豆管理</title><link rel="stylesheet" href="style.css"><body><aside><div class="brand">▦ 豆屿<span>BEAD STUDIO</span></div><nav><button data-tab="patterns">◈ 图纸收藏</button><button data-tab="inventory">▦ 我的豆仓</button><button data-tab="history">◷ 库存流水</button></nav><div class="aside-foot">一颗一颗，拼成喜欢。<small>MARD · 221 色</small></div></aside><main><header><span>我的创作空间 / <b id="crumb">图纸收藏</b></span><div><button id="export">导出备份 ↗</button><button id="import">导入备份</button><input type="file" id="backupFile" hidden accept="application/json"></div></header><section class="intro"><div><small>MAKE SOMETHING YOU LOVE</small><h1 id="title">把喜欢，拼进日常。</h1><p id="subtitle">收藏灵感、整理豆仓，让每一次开拼都心中有数。</p></div><button class="primary" id="add">＋ 添加图纸</button></section><section id="stats" class="stats"></section><section id="correctionNotice" hidden></section><section class="toolbar"><div id="filters"><button data-filter="all" class="active">全部图纸</button><button data-filter="pending">待拼</button><button data-filter="inprogress">拼中</button><button data-filter="done">已拼</button></div><input id="search" placeholder="搜索图纸名称…" aria-label="搜索"><select id="sort" aria-label="排序"><option value="code">默认排序</option><option value="low">库存从少到多</option></select></section><div id="content"></div><footer>数据保存在当前浏览器 · 建议定期导出备份 · 用量按图纸统计，不含损耗<br>色卡参考 <a href="https://www.beadinn.com/zh/fuse-beads-color-chart/mard/" target="_blank" rel="noreferrer">Beadinn MARD 色卡</a> · 屏幕颜色仅供参考</footer></main><dialog id="detail"></dialog><dialog id="formDialog"></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
